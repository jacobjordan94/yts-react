<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vite.svg" />

    <!-- Theme & Color -->
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />

    <!-- Author & Site Info -->
    <meta name="author" content="Jacob Jordan" />
    <meta name="application-name" content="YTS Movie Browser" />

    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YTS Movies" />

    <!-- Disable auto-detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Security & Privacy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Performance: Preconnect to external domains -->
    <link rel="preconnect" href="https://yts.mx" />
    <link rel="dns-prefetch" href="https://yts.mx" />

    <title>YTS Movie Browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
